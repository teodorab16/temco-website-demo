# Rebuilds the site and publishes ./site to the `gh-pages` branch whenever the
# default branch changes. GitHub Pages serves that branch:
# Settings → Pages → Build and deployment → Deploy from a branch → gh-pages / (root)
name: Publish site to gh-pages
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: gh-pages
  cancel-in-progress: true
jobs:
  publish:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build (links relative to /<repo>/ for the 404 page)
        run: SITE_BASE=/${{ github.event.repository.name }}/ node build/build.mjs
      - name: Check links
        run: node scripts/check-links.mjs
      - name: Push to gh-pages
        working-directory: site
        run: |
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Deploy ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" gh-pages
